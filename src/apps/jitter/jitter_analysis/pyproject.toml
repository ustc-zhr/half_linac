[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jitter-analysis"
version = "0.1.0"
description = "EPICS online acquisition and analysis GUI scaffold"
requires-python = ">=3.10"
dependencies = [
  "PyQt5>=5.15",
  "pyqtgraph>=0.13",
  "numpy>=1.24",
  "scipy>=1.10",
  "pandas>=2.0",
  "h5py>=3.10",
  "pyepics>=3.5"
]

[project.optional-dependencies]
dev = [
  "pytest>=8"
]

[project.scripts]
jitter-analysis = "jitter_analysis.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
