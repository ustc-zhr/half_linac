name: half_linac
channels:
  - conda-forge
  - defaults
dependencies:
  # Keep this file declarative and portable. Do not export base-environment
  # packages such as conda, conda-token, conda-build, or exact build strings.
  - python=3.11
  - pip

  # GUI runtime
  - pyqt=5.15
  - pyqtwebengine
  - pyopengl
  - pyqtgraph>=0.13

  # Scientific stack
  - numpy>=1.24
  - scipy>=1.10
  - matplotlib>=3.7
  - scikit-image
  - scikit-learn
  - pandas>=2.0
  - h5py>=3.10

  # General utilities
  - pyyaml>=6.0
  - requests>=2.31
  - psutil
  - tqdm
  - pytest>=8

  # Optimization helpers used by optional workflows.
  - bayesian-optimization

  # SDDS Python bindings are intentionally not pinned here. The old
  # environment used soliday::sdds, which is not available on standard
  # channels in the control-room solver. Install the site-supported SDDS
  # binding separately before running VM/model/energy-spectrum workflows
  # that import sdds.SDDS.

  - pip:
      - pyepics>=3.5
